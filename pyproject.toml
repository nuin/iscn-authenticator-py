[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iscn-authenticator"
version = "0.2.1"
description = "ISCN 2024 karyotype validation — parser, rule engine, and types. Pure Python, zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paulo Nuin" }]
keywords = [
  "iscn",
  "iscn-2024",
  "karyotype",
  "cytogenetics",
  "cytogenomics",
  "bioinformatics",
  "validation",
  "nomenclature",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://bioinformat.org/projects/iscn-authenticator"
Repository = "https://github.com/nuin/iscn-authenticator-py"
Issues = "https://github.com/nuin/iscn-authenticator-py/issues"
Changelog = "https://github.com/nuin/iscn-authenticator-py/blob/master/CHANGELOG.md"
Documentation = "https://github.com/nuin/iscn-authenticator-py#readme"

[project.optional-dependencies]
# The suite runs on stdlib unittest. Hypothesis powers the property-based
# tests in tests/test_properties.py, which are skipped when it is absent.
test = ["hypothesis>=6.100"]

[tool.hatch.build.targets.wheel]
packages = ["iscn_authenticator"]

[tool.hatch.build.targets.sdist]
include = [
  "iscn_authenticator/",
  "fixtures/",
  "tests/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
